<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLP view, variant B: thumb bar</title>
<!-- Shape B: the page scrolls as it does today, and a bar fixed to the bottom of the screen holds three
     wide buttons, where an iPad user's thumbs rest. Unsure is a strip that sits on top of the bar.
     Fake data. Try the keys A, D, L, and the Unsure toggle. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f3f5f8; color: #16202c; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: 150px; }
  .banner { display: flex; gap: 22px; align-items: center; background: #fff; border-bottom: 1px solid #d9dfe7; padding: 10px 20px; }
  .brand { font-weight: 700; color: #1d4f91; }
  .banner small { color: #6b7785; text-transform: uppercase; font-size: 11px; letter-spacing: .06em; display: block; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 20px 0; }
  .chip { font-size: 13px; padding: 3px 11px; border-radius: 999px; border: 1px solid #cfd7e2; background: #fff; color: #6b7785; }
  .chip.cur { border: 2px solid #16202c; color: #16202c; font-weight: 600; }
  main { max-width: 900px; margin: 0 auto; padding: 14px 20px; display: grid; gap: 14px; }
  .card { background: #fff; border: 1px solid #d9dfe7; border-radius: 10px; padding: 14px 16px; }
  h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #6b7785; }
  .row { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .tword { font-size: 44px; font-weight: 700; }
  .call { font-size: 24px; font-weight: 700; color: #9b2c13; }
  .note { color: #6b7785; font-size: 13px; }
  .wave { height: 70px; border-radius: 6px; background: repeating-linear-gradient(90deg, #c9d6ea 0 3px, transparent 3px 6px); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #d9dfe7; box-shadow: 0 -6px 20px rgba(0,0,0,.06); }
  .unsure { display: none; background: #fff4d6; color: #6b4a00; font-weight: 700; text-align: center; padding: 8px; border-bottom: 1px solid #f0d58a; }
  body.is-unsure .unsure { display: block; }
  .btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; padding: 12px 20px 16px; max-width: 1100px; margin: 0 auto; }
  .big { font: inherit; font-size: 20px; font-weight: 700; height: 84px; border-radius: 14px; border: 0; cursor: pointer; color: #fff; display: grid; place-items: center; line-height: 1.1; }
  .big small { font-weight: 500; font-size: 13px; opacity: .85; }
  .agree { background: #23633a; } .disagree { background: #9b2c13; } .listen { background: #1d4f91; }
  .big.on { outline: 4px solid #16202c; outline-offset: 3px; }
  .status { text-align: center; color: #44505e; font-size: 13px; padding-bottom: 6px; }
  .toggle { position: fixed; right: 12px; top: 12px; font-size: 13px; background: #fff; border: 1px solid #ccc; padding: 6px 10px; border-radius: 6px; }
</style>
</head>
<body>
<div class="banner"><span class="brand">Speak Up</span><div><small>Student</small><b>S-104</b></div><div><small>Age</small><b>7 yr 3 mo</b></div></div>
<div class="chips"><span class="chip">red ✓</span><span class="chip">rabbit ✓</span><span class="chip cur">carrot</span><span class="chip">tiger</span><span class="chip">car</span></div>
<main>
  <div class="card row"><div class="tword">carrot</div><div class="note">r in the middle, word 3 of 8</div></div>
  <div class="card"><h3>Arti suggests</h3><div class="call">The r sounded off</div><div class="note">62% sure. Heard: not a clear r.</div></div>
  <div class="card"><h3>Recording</h3><div class="wave"></div><p class="note">1.2 s of speech. Recording OK.</p></div>
  <div class="card"><h3>Notes</h3><input placeholder="Typing here: keys do nothing" style="width:100%;padding:6px"></div>
</main>
<div class="bar">
  <div class="unsure">Unsure, SLP please listen</div>
  <div class="btns">
    <button class="big agree" data-k="a">Agree<small>A key</small></button>
    <button class="big disagree" data-k="d">Disagree<small>D key</small></button>
    <button class="big listen" data-k="l">Listen again<small>L key</small></button>
  </div>
  <div class="status" id="saved">Not checked yet. Next keeps Arti's call.</div>
</div>
<label class="toggle"><input type="checkbox" id="u"> Show the Unsure state</label>
<script>
  const said = { a: "You agreed: the r sounded off.", d: "You disagreed: the r sounded right.", l: "Playing the clip again." };
  function act(k) {
    if (k === "l") { document.getElementById("saved").textContent = said.l; return; }
    document.querySelectorAll(".big").forEach(b => b.classList.toggle("on", b.dataset.k === k));
    document.getElementById("saved").textContent = said[k] + " Saved.";
  }
  document.querySelectorAll(".big").forEach(b => b.addEventListener("click", () => act(b.dataset.k)));
  document.addEventListener("keydown", e => {
    if (e.target.closest("input, textarea, select, [contenteditable]") || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase(); if ("adl".includes(k) && k.length === 1) { e.preventDefault(); act(k); }
  });
  document.getElementById("u").addEventListener("change", e => document.body.classList.toggle("is-unsure", e.target.checked));
</script>
</body>
</html>
